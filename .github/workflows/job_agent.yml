name: Sustainability Job Agent

on:
  schedule:
    - cron: "0 8 * * 0"       # once a week: Sunday 08:00 UTC (10:00 Belgian summer time, 09:00 winter)
  workflow_dispatch:          # Also allows manual runs from the GitHub Actions tab
    inputs:
      dry_run:
        description: "Test run: print what would be added instead of writing to Notion"
        type: boolean
        default: false

# Needed to save the agent's memory (seen jobs, discovered companies) back to the repo
permissions:
  contents: write

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic requests beautifulsoup4 python-dotenv playwright

      - name: Install Playwright's Chromium browser
        run: playwright install --with-deps chromium

      # One-time bridge: before this version, seen jobs lived in GitHub's cache.
      # Only restored when the repo doesn't have the file yet.
      - name: Restore seen jobs from the old cache
        if: hashFiles('seen_jobs.json') == ''
        uses: actions/cache/restore@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Run job agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_PROFILE_PAGE_ID: ${{ secrets.NOTION_PROFILE_PAGE_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: python job_agent.py

      - name: Save the agent's memory to the repo
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          for f in seen_jobs.json companies.json discovery_state.json company_discovery.log; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "Update agent memory"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
